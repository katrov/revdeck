name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=NPM_TOKEN is not set::Add an npm granular access token with 'Bypass 2FA' and read/write access to revdeck under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm whoami
      - name: Publish to npm
        run: |
          npm publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E '^npm error' "$RUNNER_TEMP/publish.log" | head -10 | tr '\n' ' ')
            [ -z "$summary" ] && summary=$(tail -5 "$RUNNER_TEMP/publish.log" | tr '\n' ' ')
            echo "::error title=npm publish failed::$summary"
            exit "$code"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
