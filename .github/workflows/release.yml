name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; Node 24 may ship an older one.
      - name: Install npm with OIDC support
        run: npm install -g npm@^11.15
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify OIDC permissions
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error title=id-token is not writable::The publish job needs 'permissions: id-token: write' for trusted publishing."
            exit 1
          fi
      - name: Publish to npm
        run: |
          npm publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E '^npm error' "$RUNNER_TEMP/publish.log" | head -10 | tr '\n' ' ')
            [ -z "$summary" ] && summary=$(tail -5 "$RUNNER_TEMP/publish.log" | tr '\n' ' ')
            echo "::error title=npm publish failed::$summary"
            exit "$code"
          fi
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
