name: Bug report
description: Something does not work as expected
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove tokens, private code and personal data from logs.
        Security issues go to SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Command, expected result, actual result.
      placeholder: |
        revdeck context 42
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: revdeck version
      placeholder: output of `revdeck --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.13.0, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - GitLab
        - GitHub
        - Both
        - Neither (CLI/daemon/UI only)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `revdeck daemon logs`. Secrets removed.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed tokens and private data from this report.
          required: true
        - label: I checked the existing issues.
          required: true
