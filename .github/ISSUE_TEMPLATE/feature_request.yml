name: Feature request
description: Suggest an improvement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should revdeck do? Include CLI/MCP/UI shape if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Existing tools, workarounds, or a smaller change.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps publishing approval-gated.
          required: true
        - label: This does not add a network dependency to the agent.
          required: true
