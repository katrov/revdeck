// ---- Редактор комментария (как в GitLab): панель форматирования, горячие клавиши, продолжение списков, предпросмотр.
function replaceRange(area, from, to, text, selStart, selEnd) {
    area.focus();
    area.setSelectionRange(from, to);
    // execCommand сохраняет историю отмены (Ctrl+Z) и сам вызывает input; без него - запасной путь.
    if (!document.execCommand('insertText', false, text)) {
        area.setRangeText(text, from, to, 'end');
        area.dispatchEvent(new Event('input', { bubbles: true }));
    }
    area.setSelectionRange(selStart, selEnd);
}

function wrapSelection(area, before, after, placeholder) {
    const { selectionStart: s, selectionEnd: e, value } = area;
    const picked = value.slice(s, e) || placeholder;
    replaceRange(area, s, e, before + picked + after, s + before.length, s + before.length + picked.length);
}

// Применяет префикс к каждой строке выделения; повторное применение того же префикса его снимает.
function prefixLines(area, prefixOf) {
    const { selectionStart: s, selectionEnd: e, value } = area;
    const from = value.lastIndexOf('\n', s - 1) + 1;
    const nl = value.indexOf('\n', e);
    const to = nl === -1 ? value.length : nl;
    const lines = value.slice(from, to).split('\n');
    const prefixes = lines.map((_, i) => prefixOf(i));
    const all = lines.every((line, i) => line.startsWith(prefixes[i]));
    const block = lines.map((line, i) => (all ? line.slice(prefixes[i].length) : prefixes[i] + line)).join('\n');
    replaceRange(area, from, to, block, from, from + block.length);
}

function insertLink(area) {
    const { selectionStart: s, selectionEnd: e, value } = area;
    const label = value.slice(s, e) || 'текст';
    const text = `[${label}](url)`;
    const urlStart = s + label.length + 3;
    replaceRange(area, s, e, text, urlStart, urlStart + 3);
}

function insertSuggestion(area) {
    const { selectionStart: s, selectionEnd: e, value } = area;
    const picked = value.slice(s, e);
    const head = '```suggestion:-0+0\n';
    replaceRange(area, s, e, `${head}${picked}\n\`\`\``, s + head.length, s + head.length + picked.length);
}

const TOOLS = [
    ['suggest', '±', 'Предложить изменение', (a) => insertSuggestion(a), true],
    ['bold', 'B', 'Жирный (Ctrl+B)', (a) => wrapSelection(a, '**', '**', 'текст')],
    ['italic', 'I', 'Курсив (Ctrl+I)', (a) => wrapSelection(a, '_', '_', 'текст')],
    ['strike', 'S', 'Зачёркнутый', (a) => wrapSelection(a, '~~', '~~', 'текст')],
    ['|'],
    ['quote', '❝', 'Цитата', (a) => prefixLines(a, () => '> ')],
    ['code', '</>', 'Код', (a) => (a.value.slice(a.selectionStart, a.selectionEnd).includes('\n') ? wrapSelection(a, '```\n', '\n```', 'код') : wrapSelection(a, '`', '`', 'код'))],
    ['link', '🔗', 'Ссылка (Ctrl+K)', (a) => insertLink(a)],
    ['|'],
    ['ul', '•', 'Маркированный список', (a) => prefixLines(a, () => '- ')],
    ['ol', '1.', 'Нумерованный список', (a) => prefixLines(a, (i) => `${i + 1}. `)],
    ['task', '☑', 'Список задач', (a) => prefixLines(a, () => '- [ ] ')],
];

// Enter в строке списка продолжает список, Enter в пустом пункте его заканчивает.
const LIST_ITEM = /^(\s*)(?:(\d+)\.|[-*])(\s+\[[ x]\])?\s+/;
function continueList(area, e) {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || area.selectionStart !== area.selectionEnd) return;
    const { selectionStart: pos, value } = area;
    const from = value.lastIndexOf('\n', pos - 1) + 1;
    const line = value.slice(from, pos);
    const m = LIST_ITEM.exec(line);
    if (!m) return;
    e.preventDefault();
    if (line.length === m[0].length) {
        replaceRange(area, from, pos, '', from, from);
        return;
    }
    const marker = m[2] ? `${Number(m[2]) + 1}.` : line.trim()[0];
    const insert = `\n${m[1]}${marker}${m[3] ? ' [ ]' : ''} `;
    replaceRange(area, pos, pos, insert, pos + insert.length, pos + insert.length);
}

// Безопасный предпросмотр Markdown: узлы DOM, без innerHTML; ссылки только http(s).
const INLINE = /`([^`]+)`|\*\*(.+?)\*\*|~~(.+?)~~|(?<![\w])_(.+?)_(?![\w])|\*(.+?)\*|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(@[\w.-]+)/gu;
function inlineMd(text) {
    const out = [];
    let last = 0;
    for (const m of text.matchAll(INLINE)) {
        if (m.index > last) out.push(text.slice(last, m.index));
        if (m[1] !== undefined) out.push(el('code', {}, m[1]));
        else if (m[2] !== undefined) out.push(el('b', {}, ...inlineMd(m[2])));
        else if (m[3] !== undefined) out.push(el('s', {}, ...inlineMd(m[3])));
        else if (m[4] !== undefined || m[5] !== undefined) out.push(el('i', {}, ...inlineMd(m[4] ?? m[5])));
        else if (m[6] !== undefined) out.push(el('a', { href: m[7], target: '_blank', rel: 'noopener noreferrer' }, ...inlineMd(m[6])));
        else out.push(el('b', {}, m[8]));
        last = m.index + m[0].length;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
}

function renderMarkdown(source) {
    const lines = source.replace(/\r\n?/g, '\n').split('\n');
    const nodes = [];
    for (let i = 0; i < lines.length;) {
        const line = lines[i];
        if (/^```/.test(line)) {
            const code = [];
            for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
            i++;
            nodes.push(el('pre', {}, el('code', {}, code.join('\n'))));
        } else if (/^>\s?/.test(line)) {
            const quote = [];
            for (; i < lines.length && /^>\s?/.test(lines[i]); i++) quote.push(lines[i].replace(/^>\s?/, ''));
            nodes.push(el('blockquote', {}, ...inlineMd(quote.join('\n'))));
        } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
            const ordered = /^\s*\d+\./.test(line);
            const items = [];
            for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) {
                const task = /^\s*(?:[-*]|\d+\.)\s+\[([ x])\]\s+(.*)$/.exec(lines[i]);
                const text = task ? task[2] : lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/, '');
                const li = el('li', {}, ...(task ? [el('input', { type: 'checkbox', disabled: true, checked: task[1] === 'x' }), ' '] : []), ...inlineMd(text));
                items.push(li);
            }
            nodes.push(el(ordered ? 'ol' : 'ul', {}, ...items));
        } else if (line.trim() === '') {
            i++;
        } else {
            const para = [];
            for (; i < lines.length && lines[i].trim() !== '' && !/^(```|>|\s*([-*]|\d+\.)\s+)/.test(lines[i]); i++) para.push(lines[i]);
            nodes.push(el('p', {}, ...inlineMd(para.join('\n'))));
        }
    }
    return nodes;
}

// Оборачивает поле ответа: вкладки «Написать / Предпросмотр», панель форматирования и горячие клавиши.
function makeEditor(area, canSuggest) {
    const preview = el('div', { className: 'preview text', hidden: true });
    const write = el('button', { type: 'button', className: 'tab' }, 'Написать');
    const view = el('button', { type: 'button', className: 'tab' }, 'Предпросмотр');
    for (const tab of [write, view]) tab.setAttribute('role', 'tab');
    const tools = el('div', { className: 'tools' });
    const show = (previewMode, focus) => {
        write.setAttribute('aria-selected', String(!previewMode));
        view.setAttribute('aria-selected', String(previewMode));
        area.hidden = previewMode;
        preview.hidden = !previewMode;
        tools.hidden = previewMode;
        if (previewMode) {
            const nodes = renderMarkdown(area.value);
            preview.replaceChildren(...(nodes.length ? nodes : [el('span', { className: 'muted' }, 'Нечего показывать')]));
        } else if (focus) {
            area.focus();
        }
    };
    write.addEventListener('click', () => show(false, true));
    view.addEventListener('click', () => show(true, false));
    const actions = new Map();
    for (const [id, label, title, run, suggestOnly] of TOOLS) {
        if (id === '|') { tools.append(el('span', { className: 'sep' })); continue; }
        if (suggestOnly && !canSuggest) continue;
        const b = el('button', { type: 'button', className: 'tool', title }, label);
        b.setAttribute('aria-label', title);
        b.addEventListener('mousedown', (e) => e.preventDefault());
        b.addEventListener('click', () => run(area));
        tools.append(b);
        actions.set(id, run);
    }
    area.addEventListener('keydown', (e) => {
        if (mention?.area === area) return;
        const mod = (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey;
        const key = mod ? { b: 'bold', i: 'italic', k: 'link' }[e.key.toLowerCase()] : null;
        if (key) {
            e.preventDefault();
            actions.get(key)(area);
            return;
        }
        continueList(area, e);
    });
    show(false);
    return el('div', { className: 'editor' }, el('div', { className: 'editor-bar', role: 'tablist' }, write, view, tools), area, preview);
}

// Цвет имени автора, как у аватарок в мессенджере, - из палитры avatarka по имени.
function colorIndex(name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return h % 11;
}

const EMOJI = { thumbsup: '👍', thumbsdown: '👎', smile: '😄', tada: '🎉', confused: '😕', heart: '❤️', rocket: '🚀', eyes: '👀' };
const REACTION_NAMES = { thumbsup: 'Нравится', thumbsdown: 'Не нравится', smile: 'Смех', tada: 'Ура', confused: 'Смущение', heart: 'Сердце', rocket: 'Ракета', eyes: 'Смотрю' };
let awards = {};            // note_id -> [{ name, users, mine }]
let meUser = '';            // логин владельца glab (приходит вместе с реакциями)
const pendingReact = new Set();  // `${note_id}:${emoji}` - запрос ещё идёт
const bars = new Map();     // note_id -> { bar, open }

function drawBar(id) {
    const entry = bars.get(id);
    if (!entry) return;
    const list = awards[id] || [];
    const chips = list.map((a) => {
        const chip = el('button', { type: 'button', className: 'secondary' + (a.mine ? ' mine' : '') + (pendingReact.has(`${id}:${a.name}`) ? ' pending' : ''), title: `${REACTION_NAMES[a.name]}: ${a.users.join(', ')}` }, `${EMOJI[a.name]} ${a.users.length}`);
        chip.setAttribute('aria-pressed', String(a.mine));
        chip.addEventListener('click', () => react(id, a.name));
        return chip;
    });
    const add = el('button', { type: 'button', className: 'secondary add', title: 'Добавить реакцию' }, '☺ +');
    add.setAttribute('aria-expanded', String(entry.open));
    add.addEventListener('click', () => { entry.open = !entry.open; drawBar(id); });
    const picker = entry.open ? [el('div', { className: 'picker' }, ...Object.keys(EMOJI).map((name) => {
        const b = el('button', { type: 'button', className: 'secondary', title: REACTION_NAMES[name] }, EMOJI[name]);
        b.setAttribute('aria-label', REACTION_NAMES[name]);
        b.addEventListener('click', () => { entry.open = false; react(id, name); });
        return b;
    }))] : [];
    entry.bar.replaceChildren(...chips, add, ...picker);
}

// Реакция показывается сразу (чип приглушён, пока идёт запрос), результат сервера её подтверждает или откатывает.
function withReaction(list, name, add) {
    const next = list.map((a) => ({ ...a, users: [...a.users] }));
    const me = meUser || 'вы';
    const entry = next.find((a) => a.name === name);
    if (add) {
        if (entry) { entry.users.push(me); entry.mine = true; } else next.push({ name, users: [me], mine: true });
    } else if (entry) {
        entry.users = entry.users.filter((u) => u !== me);
        entry.mine = false;
    }
    const order = Object.keys(EMOJI);
    return next.filter((a) => a.users.length).sort((x, y) => order.indexOf(x.name) - order.indexOf(y.name));
}

async function react(id, emoji) {
    const key = `${id}:${emoji}`;
    if (pendingReact.has(key)) return;
    const before = awards[id] || [];
    const removing = before.some((a) => a.name === emoji && a.mine);
    awards[id] = withReaction(before, emoji, !removing);
    pendingReact.add(key);
    drawBar(id);
    try {
        const res = await api('/api/react', { note_id: id, emoji });
        awards[id] = res.awards;
        toast(`${EMOJI[emoji]} ${removing ? 'реакция снята' : 'реакция поставлена'}`);
    } catch (e) {
        awards[id] = before;
        toast(`Не удалось ${removing ? 'снять' : 'поставить'} реакцию ${EMOJI[emoji]}: ${e.message}`, true);
    } finally {
        pendingReact.delete(key);
        drawBar(id);
    }
}

async function loadAwards() {
    try {
        const res = await api('/api/awards');
        awards = res.awards || {};
        meUser = res.user || '';
        if (res.failed) hint.textContent = `реакции загружены не для всех комментариев (${res.failed})`;
        for (const id of bars.keys()) drawBar(id);
    } catch (e) {
        hint.textContent = `реакции не загружены: ${e.message}`;
    }
}

function renderNotes(notes, threadId) {
    return notes.map((n) => {
        const when = n.at && !Number.isNaN(Date.parse(n.at)) ? new Date(n.at).toLocaleString('ru-RU', { dateStyle: 'medium', timeStyle: 'short' }) : '';
        const avatar = el('div', { className: 'avatar' }, [...(n.name || n.author)][0]?.toUpperCase() ?? '?');
        avatar.setAttribute('aria-hidden', 'true');
        avatar.style.setProperty('--h', String(colorIndex(n.author) * 33));
        const head = el('div', { className: 'msg-head' }, el('b', {}, n.name || n.author), el('span', {}, `@${n.author}`), when ? el('span', {}, when) : '');
        const text = el('div', { className: 'text' }, n.body);
        const body = el('div', { className: 'msg-body' }, head, text, reactionBar(n.id));
        if (n.id && threadId && meUser && n.author === meUser) head.append(...ownNoteControls(threadId, n, text, body));
        return el('div', { className: 'msg' }, avatar, body);
    });
}

// Своя заметка в треде: правка и удаление уходят в GitLab (разрешены только автору) после подтверждения.
function ownNoteControls(threadId, n, textEl, bodyEl) {
    const edit = el('button', { type: 'button', className: 'secondary mini' }, 'Редактировать');
    const remove = el('button', { type: 'button', className: 'secondary mini' }, 'Удалить');
    const where = cards.get(threadId)?.thread.path ? `${cards.get(threadId).thread.path}${cards.get(threadId).thread.line ? ':' + cards.get(threadId).thread.line : ''}` : 'общий комментарий';
    edit.addEventListener('click', () => {
        const area = el('textarea', { value: n.body });
        area.setAttribute('aria-label', 'Новый текст заметки');
        const save = el('button', { type: 'button' }, 'Сохранить в GitLab');
        const cancel = el('button', { type: 'button', className: 'secondary' }, 'Отмена');
        const editor = el('div', { className: 'note-edit' }, area, el('div', { className: 'actions' }, save, cancel));
        textEl.hidden = true;
        edit.disabled = remove.disabled = true;
        textEl.after(editor);
        const close = () => { editor.remove(); textEl.hidden = false; edit.disabled = remove.disabled = false; };
        cancel.addEventListener('click', close);
        area.addEventListener('input', () => { save.disabled = !area.value.trim() || area.value.trim() === n.body.trim(); });
        save.disabled = true;
        save.addEventListener('click', async () => {
            const next = area.value.trim();
            const ok = await confirmDialog({ title: `${mrLabel()}: изменить заметку в треде`, items: [{ head: `${where} · было`, text: n.body }, { head: `${where} · станет`, text: next, flags: textFlags(next) }], ok: 'Сохранить в GitLab' });
            if (!ok) return;
            save.disabled = cancel.disabled = true;
            try {
                const res = await api('/api/edit-thread-note', { discussion_id: threadId, note_id: n.id, text: next, expected_body: n.body });
                if (res.version) version = res.version;
                toast('Заметка изменена в GitLab');
                await afterNoteChange();
            } catch (e) {
                onError(e, 'заметка не изменена');
                save.disabled = cancel.disabled = false;
            }
        });
        area.focus();
    });
    remove.addEventListener('click', async () => {
        const ok = await confirmDialog({ title: `${mrLabel()}: удалить заметку из GitLab`, items: [{ head: where, text: n.body }], note: 'Если это единственная заметка треда, GitLab удалит весь тред.', ok: 'Удалить из GitLab' });
        if (!ok) return;
        edit.disabled = remove.disabled = true;
        try {
            const res = await api('/api/delete-thread-note', { discussion_id: threadId, note_id: n.id });
            if (res.version) version = res.version;
            toast('Заметка удалена из GitLab');
            await afterNoteChange();
        } catch (e) {
            onError(e, 'заметка не удалена');
            edit.disabled = remove.disabled = false;
        }
    });
    return [edit, remove];
}

// После правки или удаления заметки: статус ответа мог измениться на сервере (replies.json), переписка - в GitLab.
async function afterNoteChange() {
    try {
        await resync();
    } catch {}
    await refreshThreads();
    loadAwards();
}

function reactionBar(id) {
    if (!id) return '';
    const bar = el('div', { className: 'reactions' });
    bars.set(id, { bar, open: false });
    drawBar(id);
    return bar;
}

// Подтягивает переписку из GitLab (ответы из UI и чужие). Поля ввода не трогаются.
async function refreshThreads() {
    const { threads, threadsError } = await api('/api/threads');
    const seen = new Set();
    for (const t of threads) {
        seen.add(t.id);
        const c = cards.get(t.id);
        if (!c) continue;
        c.thread = t;
        c.notesBox.replaceChildren(...renderNotes(t.notes, t.id));
        showPosted(c, done.get(t.id)?.posted);
    }
    // Тред, которого в GitLab больше нет (удалена единственная заметка), убирается со страницы.
    if (!threadsError) {
        for (const [id, c] of cards) {
            if (seen.has(id)) continue;
            c.root.remove();
            cards.delete(id);
            const i = cardFiles.findIndex((f) => f.root === c.root);
            if (i >= 0) cardFiles.splice(i, 1);
        }
    }
    scheduleTree();
    refresh();
    if (threadsError) hint.textContent = `переписка не обновлена из GitLab, показана выгрузка: ${threadsError}`;
}

// Опубликованный ответ показывается над полем, только если его ещё нет в переписке треда
// (если GitLab недоступен и переписка взята из выгрузки). Поле свободно для нового ответа.
function showPosted(c, posted) {
    const text = String(posted ?? '').trim();
    c.postedBox.hidden = !text || c.thread.notes.some((n) => n.body.trim() === text);
    c.postedBox.replaceChildren(...(text ? [el('div', { className: 'where' }, 'Опубликовано в GitLab'), el('div', { className: 'text' }, text)] : []));
}

function statusText(d) {
    if (d.error) return `ошибка: ${d.error}`;
    return [d.replied && 'ответ опубликован', d.resolved && 'тред закрыт'].filter(Boolean).join(', ');
}

// Что ещё нужно отправить в GitLab: новый текст ответа (правка опубликованного - это новый ответ) и/или закрытие треда.
const replyNeeded = (id, c) => {
    const d = done.get(id) || {};
    return Boolean(c.area.value.trim()) && !(d.replied && c.area.value.trim() === String(d.posted ?? '').trim());
};
const resolveNeeded = (id, c) => c.resolve.checked && !done.get(id)?.resolved;
const actionable = (id, c) => replyNeeded(id, c) || resolveNeeded(id, c);

function render(state) {
    mr = state.mr;
    people = state.people || [];
    meUser = state.user || meUser;
    version = state.version;
    blocked = version === null ? `replies.json недоступен, запись отключена: ${state.warning}` : '';
    hint.textContent = blocked || state.warning || (state.threadsError ? `GitLab недоступен, переписка из выгрузки: ${state.threadsError}` : '');
    showHandoff(state.handoff);
    const info = state.info || {};
    document.getElementById('title').textContent = `MR !${mr}${info.title ? ` · ${info.title}` : ''}`;
    project = info.project || '';
    const list = document.getElementById('list');
    list.replaceChildren();
    cards.clear();
    dirty.clear();
    generalDirty = false;
    generalArea = el('textarea', { className: 'agent', value: state.general_note || '', placeholder: 'Общий комментарий агенту по всему MR (в GitLab не уходит)' });
    generalArea.setAttribute('aria-label', 'Общий комментарий агенту по всему MR');
    generalArea.addEventListener('input', () => { generalDirty = true; touch(); });
    cardFiles.length = 0;
    diffFiles = state.diffFiles || [];
    const summaryCard = renderSummary(state.summary);
    if (summaryCard) { list.append(summaryCard); registerCard(summaryCard, null); }
    list.append(el('div', { id: 'diffs' }));
    diffCache.clear();
    userNotes = (state.notes || []).map((n) => ({ ...n }));
    noteDirty.clear();
    bars.clear();
    findingCards.clear();
    findingDirty.clear();
    for (const f of state.findings || []) {
        const findingCard = renderFinding(f, (state.decisions || {})[f.id], (state.published || {})[f.id]);
        list.append(findingCard);
        registerCard(findingCard, f.file);
    }
    const generalCard = el('section', { className: 'card' }, el('div', { className: 'where' }, 'Агенту · весь MR'), generalArea);
    list.append(generalCard);
    registerCard(generalCard, null);
    document.getElementById('count').textContent = `${project ? project + ' · ' : ''}тредов: ${state.threads.length}${(state.findings || []).length ? `, замечаний ревью: ${state.findings.length}` : ''}${userNotes.length ? `, комментариев к строкам: ${userNotes.length} (кнопка «Diff»)` : ''}`;
    for (const thread of state.threads) {
        const draft = state.drafts[thread.id] || { reply: '', resolve: false, note_for_agent: '', agent_action: '', posted: '', replied: false, resolved: false, error: '' };
        if (draft.replied || draft.resolved) done.set(thread.id, { replied: draft.replied, resolved: draft.resolved, posted: draft.posted });
        const canResolve = thread.resolvable && !thread.resolved;
        const published = draft.replied;
        const area = el('textarea', { value: published ? '' : draft.reply, placeholder: published ? 'Ещё один ответ в тред (@ - упомянуть)' : 'Ответ в тред (пусто - без ответа, @ - упомянуть)' });
        const postedBox = el('div', { className: 'posted' });
        const notesBox = el('div', { className: 'notes' }, ...renderNotes(thread.notes, thread.id));
        area.setAttribute('aria-label', `Ответ в тред ${thread.id.slice(0, 8)}`);
        attachMentions(area);
        const editor = makeEditor(area, Boolean(thread.path));
        const note = el('textarea', { className: 'agent', value: draft.note_for_agent, placeholder: 'Заметка агенту (в GitLab не уходит)' });
        note.setAttribute('aria-label', `Заметка агенту по треду ${thread.id.slice(0, 8)}`);
        const action = el('select', {}, ...ACTIONS.map(([value, label]) => el('option', { value, selected: value === draft.agent_action }, label)));
        // Выбор для публикации всегда делает пользователь: черновик агента сам не отмечается.
        action.setAttribute('aria-label', `Действие для агента по треду ${thread.id.slice(0, 8)}`);
        const include = el('input', { type: 'checkbox' });
        const resolve = el('input', { type: 'checkbox', checked: canResolve && draft.resolve, disabled: !canResolve });
        const status = el('span', { className: 'badge ' + (draft.error ? 'err' : 'ok') }, statusText(draft));
        const where = [thread.path ? fileLoc(thread.path, thread.line) : null, thread.resolved ? 'закрыт' : null]
            .filter(Boolean);
        if (!where.length) where.push('общий комментарий');
        const root = el('section', { className: 'card' },
            el('div', { className: 'where' }, ...where),
            notesBox,
            postedBox,
            editor,
            note,
            el('div', { className: 'controls' },
                action,
                el('label', {}, include, 'Публиковать'),
                el('label', {}, resolve, 'Закрыть тред'),
                status));
        for (const control of [area, note, action, include, resolve]) {
            control.addEventListener('input', () => { if (control !== include) dirty.add(thread.id); touch(); });
        }
        const card = { thread, where, area, note, action, include, resolve, canResolve, keepResolve: draft.resolve, status, root, postedBox, notesBox };
        showPosted(card, draft.posted);
        cards.set(thread.id, card);
        root.classList.toggle('done', (draft.replied || draft.resolved) && !actionable(thread.id, card));
        list.append(root);
        registerCard(root, thread.path);
    }
    list.append(el('div', { className: 'card empty', id: 'empty-files', hidden: true }, 'В выбранном файле или папке нет карточек. Нажмите на него ещё раз или выберите «Все карточки».'));
    applyFilter();
    refresh();
}

// Подтягивает состояние файла после конфликта версий (агент записал replies.json): карточки, которые
// пользователь не трогал, обновляются, а его несохранённые правки остаются и уйдут поверх.
function applyServerState(state) {
    version = state.version;
    people = state.people || people;
    meUser = state.user || meUser;
    showHandoff(state.handoff);
    if (Array.isArray(state.notes)) applyNotes(state.notes);
    if (!generalDirty) generalArea.value = state.general_note || '';
    for (const [id, c] of cards) {
        const draft = state.drafts[id];
        if (!draft) {
            done.delete(id);
            continue;
        }
        if (draft.replied || draft.resolved) done.set(id, { replied: draft.replied, resolved: draft.resolved, posted: draft.posted });
        else done.delete(id);
        showPosted(c, draft.posted);
        if (dirty.has(id)) continue;
        c.area.value = draft.replied ? '' : draft.reply;
        c.note.value = draft.note_for_agent;
        c.action.value = draft.agent_action;
        c.resolve.checked = c.canResolve && draft.resolve;
        c.keepResolve = draft.resolve;
        c.status.className = 'badge ' + (draft.error ? 'err' : 'ok');
        c.status.textContent = statusText(draft);
        c.root.classList.toggle('done', (draft.replied || draft.resolved) && !actionable(id, c));
    }
    refresh();
}

async function resync() {
    const state = await api('/api/state');
    if (state.version === null) {
        block(`replies.json недоступен, запись отключена: ${state.warning}`);
        throw new Error(blocked);
    }
    applyServerState(state);
}

const pending = () => [...cards].filter(([id, c]) => c.include.checked && actionable(id, c));

let saveTimer;
function refresh() {
    scheduleTree();
    const n = pending().length;
    document.getElementById('publish').disabled = n === 0 || Boolean(blocked);
    document.getElementById('handoff').disabled = Boolean(blocked);
    const findingsButton = document.getElementById('publish-findings');
    const findingsCount = pendingFindings().length;
    findingsButton.hidden = findingCards.size === 0;
    findingsButton.disabled = findingsCount === 0;
    findingsButton.textContent = findingsCount ? `Опубликовать замечания (${findingsCount})` : 'Опубликовать замечания';
    document.getElementById('summary').textContent = n ? `выбрано тредов: ${n}` : 'ничего не выбрано';
}

function touch() {
    refresh();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveDrafts().catch((e) => onError(e, 'черновики не сохранены')), 600);
}

// Отправляются только изменённые карточки: нетронутые черновики агента не перезаписываются.
// Ошибка пробрасывается: вызывающий (handoff, публикация) не должен идти дальше с несохранёнными правками.
function saveDrafts(options) {
    clearTimeout(saveTimer);
    return enqueue(async () => {
        let resynced = false;
        for (let attempt = 0; ; attempt++) {
            if (blocked) throw new Error(blocked);
            const ids = [...dirty];
            const general = generalDirty;
            if (!ids.length && !general) return { resynced };
            const drafts = {};
            for (const id of ids) {
                const c = cards.get(id);
                drafts[id] = {
                    reply: c.area.value,
                    resolve: c.canResolve ? c.resolve.checked : c.keepResolve,
                    note_for_agent: c.note.value,
                    agent_action: c.action.value,
                };
            }
            dirty.clear();
            generalDirty = false;
            try {
                const res = await api('/api/drafts', { version, drafts, ...(general ? { general_note: generalArea.value } : {}) }, options);
                version = res.version;
                hint.textContent = resynced ? 'файл изменён агентом: его правки подтянуты, ваши сохранены поверх' : '';
                return { resynced };
            } catch (e) {
                ids.forEach((id) => dirty.add(id));
                generalDirty = generalDirty || general;
                if (e.status !== 409 || attempt > 0 || options?.keepalive) throw e;
                // Агент изменил файл: подтягиваем его правки к карточкам, которые вы не трогали, и сохраняем свои поверх.
                await resync();
                resynced = true;
            }
        }
    });
}

function showHandoff(handoff) {
    document.getElementById('handoff').title = handoff ? `передано ${new Date(handoff.at).toLocaleTimeString()}, агент ещё не сбросил метку` : '';
}

document.getElementById('select-all').addEventListener('click', () => {
    for (const [id, c] of cards) c.include.checked = actionable(id, c);
    refresh();
});

// Метка handoff будит агента, который ждёт её в фоне; фраза в буфере - запасной путь для чата.
document.getElementById('handoff').addEventListener('click', async () => {
    try {
        await saveNotes();
        await saveDrafts();
        await enqueue(async () => {
            try {
                version = (await api('/api/drafts', { version, handoff: true })).version;
            } catch (e) {
                if (e.status !== 409) throw e;
                await resync();
                version = (await api('/api/drafts', { version, handoff: true })).version;
            }
        });
    } catch (e) {
        onError(e, 'не удалось передать');
        return;
    }
    const all = [...cards.values()];
    const notes = all.filter((c) => c.note.value.trim()).length + (generalArea.value.trim() ? 1 : 0);
    const fixes = all.filter((c) => c.action.value === 'fix').length;
    const lineNotes = notesForAgent();
    const phrase = `MR ${mr}: правки из UI, перечитай .mr-review/mr-${mr}-replies.json (заметок: ${notes}, к правке: ${fixes})${lineNotes ? ` и mr-${mr}-notes.json (комментариев к строкам: ${lineNotes})` : ''}`;
    showHandoff({ at: new Date().toISOString() });
    try {
        await navigator.clipboard.writeText(phrase);
        hint.textContent = 'передано; фраза для чата скопирована';
    } catch {
        hint.textContent = 'передано. Фраза для чата: ' + phrase;
    }
});

// Подтверждение показывает ответы целиком и помечает то, что легко спрятать в длинном тексте.
function replyPreview(c) {
    const text = c.area.value.trim();
    const where = c.where.map((w) => (typeof w === 'string' ? w : w.textContent.replace(/Копировать$/, ''))).join(' · ');
    return { head: `${where} · ${text.split('\n').length} стр., ${text.length} симв.`, text, flags: textFlags(text) };
}

document.getElementById('publish').addEventListener('click', async () => {
    const chosen = pending();
    // Снимок того, что видно в подтверждении: сервер опубликует только совпадающий с ним текст.
    const snapshot = new Map(chosen.map(([id, c]) => [id, { reply: c.area.value, resolve: c.canResolve ? c.resolve.checked : c.keepResolve }]));
    const previews = chosen.filter(([id, c]) => replyNeeded(id, c)).map(([, c]) => replyPreview(c));
    const resolves = chosen.filter(([id, c]) => resolveNeeded(id, c)).length;
    const ok = await confirmDialog({
        title: `${mrLabel()}: ответов - ${previews.length}, закрыть тредов - ${resolves}`,
        items: previews,
        note: 'Отменить из UI нельзя: опубликованный ответ удаляется только в GitLab.',
    });
    if (!ok) return;
    const button = document.getElementById('publish');
    button.disabled = true;
    try {
        const saved = await saveDrafts();
        if (saved.resynced) {
            // Файл изменил агент, пока открыто подтверждение: карточки уже обновлены, а подтверждали вы прежний текст.
            hint.textContent = 'файл изменён агентом: карточки обновлены. Проверьте их и повторите публикацию';
            refresh();
            return;
        }
        const items = chosen.map(([id]) => ({ discussion_id: id, expected_reply: snapshot.get(id).reply, expected_resolve: snapshot.get(id).resolve }));
        const res = await enqueue(async () => {
            const result = await api('/api/publish', { version, items });
            if (result.version) version = result.version;
            return result;
        });
        for (const r of res.results) {
            const c = cards.get(r.discussion_id);
            if (!c || !r.current) continue;
            // Состояние приходит с сервера: именно этот текст ушёл в GitLab, а не то, что набрано в поле сейчас.
            done.set(r.discussion_id, { replied: r.current.replied, resolved: r.current.resolved, posted: r.current.posted });
            showPosted(c, r.current.posted);
            if (r.current.replied && c.area.value.trim() === String(r.current.posted ?? '').trim()) c.area.value = '';
            c.status.className = 'badge ' + (r.error ? 'err' : 'ok');
            c.status.textContent = r.error ? `ошибка: ${r.error}` : statusText(done.get(r.discussion_id));
            c.root.classList.toggle('done', !r.error && !actionable(r.discussion_id, c));
        }
        await refreshThreads().catch(() => {});
        if (res.warning) block(res.warning);
        else if (res.results.some((r) => r.stale)) {
            await resync();
            hint.textContent = 'часть тредов не опубликована: текст изменился после подтверждения. Карточки обновлены, проверьте их';
        } else hint.textContent = res.results.some((r) => r.error) ? 'часть тредов не опубликована, см. ошибки в карточках' : '';
    } catch (e) {
        if (e.status === 409) {
            try {
                await resync();
                hint.textContent = 'файл изменён агентом: карточки обновлены. Проверьте их и повторите публикацию';
            } catch (inner) {
                onError(inner, 'ошибка публикации');
            }
        } else {
            onError(e, 'ошибка публикации');
        }
    }
    refresh();
});

// Правки за последние 600 мс до закрытия вкладки не должны пропасть.
addEventListener('pagehide', () => {
    if (findingDirty.size) saveFindings();
    if (!blocked && (dirty.size || generalDirty)) saveDrafts({ keepalive: true }).catch(() => {});
});

api('/api/state').then((state) => { render(state); loadAwards(); }).catch((e) => { hint.textContent = e.message; });
</script>
</body>
</html>
